<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="r" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#9aa4b2"/>
    </marker>
  </defs>

  <rect width="1000" height="430" fill="#f7f8fa"/>

  <text x="40" y="32" font-size="14" font-weight="600" fill="#1f2329">注解是源头，JSON 是中间产物，UI 和 Apifox 都只是消费者</text>
  <text x="40" y="52" font-size="11" fill="#8b95a5">改代码就改文档，不需要另外维护一份 Markdown</text>

  <!-- 左：代码 -->
  <rect x="40" y="76" width="280" height="266" rx="8" fill="#ffffff" stroke="#d7dce3"/>
  <rect x="40" y="76" width="280" height="34" rx="8" fill="#eff6ff"/>
  <text x="56" y="98" font-size="12" font-weight="600" fill="#0b4a8f">① Controller / 实体上的注解</text>

  <text x="56" y="136" font-size="11" fill="#1f2329">@Tag</text>
  <text x="150" y="136" font-size="11" fill="#6b7280">分组名与说明</text>

  <text x="56" y="164" font-size="11" fill="#1f2329">@Operation</text>
  <text x="150" y="164" font-size="11" fill="#6b7280">接口用途与细节</text>

  <text x="56" y="192" font-size="11" fill="#1f2329">@Parameter</text>
  <text x="150" y="192" font-size="11" fill="#6b7280">路径/查询参数说明</text>

  <text x="56" y="220" font-size="11" fill="#1f2329">@Schema</text>
  <text x="150" y="220" font-size="11" fill="#6b7280">字段含义、示例、必填</text>

  <text x="56" y="248" font-size="11" fill="#1f2329">@ApiResponse</text>
  <text x="150" y="248" font-size="11" fill="#6b7280">各状态码的含义</text>

  <text x="56" y="278" font-size="10" fill="#1f2329">@ParameterObject</text>
  <text x="172" y="278" font-size="11" fill="#6b7280">查询对象摊平成参数</text>

  <text x="56" y="316" font-size="10" fill="#8b95a5">漏写不报错，文档里就是空白</text>

  <line x1="324" y1="209" x2="372" y2="209" stroke="#9aa4b2" stroke-width="1.4" marker-end="url(#r)"/>
  <text x="348" y="200" font-size="10" fill="#8b95a5" text-anchor="middle">扫描</text>

  <!-- 中：JSON -->
  <rect x="376" y="76" width="264" height="266" rx="8" fill="#ffffff" stroke="#d7dce3"/>
  <rect x="376" y="76" width="264" height="34" rx="8" fill="#f0fdf4"/>
  <text x="392" y="98" font-size="12" font-weight="600" fill="#115e59">② OpenAPI 3.1 JSON</text>

  <rect x="396" y="126" width="224" height="30" rx="4" fill="#f7f8fa" stroke="#e2e6ec"/>
  <text x="408" y="146" font-size="11" fill="#0b63c5">GET /v3/api-docs</text>

  <rect x="396" y="164" width="224" height="30" rx="4" fill="#f7f8fa" stroke="#e2e6ec"/>
  <text x="408" y="184" font-size="11" fill="#0b63c5">GET /v3/api-docs/book</text>

  <rect x="396" y="202" width="224" height="30" rx="4" fill="#f7f8fa" stroke="#e2e6ec"/>
  <text x="408" y="222" font-size="11" fill="#0b63c5">GET /v3/api-docs/ops</text>

  <text x="396" y="258" font-size="10" fill="#6b7280">paths：路径与操作</text>
  <text x="396" y="276" font-size="10" fill="#6b7280">components：可复用的数据结构</text>
  <text x="396" y="294" font-size="10" fill="#6b7280">info / servers：元信息</text>

  <text x="396" y="324" font-size="10" fill="#8b95a5">启动时生成一次，之后只读</text>

  <line x1="644" y1="209" x2="692" y2="209" stroke="#9aa4b2" stroke-width="1.4" marker-end="url(#r)"/>
  <text x="668" y="200" font-size="10" fill="#8b95a5" text-anchor="middle">消费</text>

  <!-- 右：消费方 -->
  <rect x="696" y="76" width="264" height="266" rx="8" fill="#ffffff" stroke="#d7dce3"/>
  <rect x="696" y="76" width="264" height="34" rx="8" fill="#faf5ff"/>
  <text x="712" y="98" font-size="12" font-weight="600" fill="#5b21b6">③ 谁会用它</text>

  <rect x="716" y="126" width="224" height="52" rx="6" fill="#ffffff" stroke="#e2e6ec"/>
  <text x="728" y="148" font-size="11" fill="#1f2329">Swagger UI</text>
  <text x="728" y="166" font-size="10" fill="#8b95a5">浏览器里直接调接口</text>

  <rect x="716" y="188" width="224" height="52" rx="6" fill="#ffffff" stroke="#e2e6ec"/>
  <text x="728" y="210" font-size="11" fill="#1f2329">Apifox / Postman</text>
  <text x="728" y="228" font-size="10" fill="#8b95a5">导入 JSON，生成请求集合</text>

  <rect x="716" y="250" width="224" height="52" rx="6" fill="#ffffff" stroke="#e2e6ec"/>
  <text x="728" y="272" font-size="11" fill="#1f2329">CI 里的契约检查</text>
  <text x="728" y="290" font-size="10" fill="#8b95a5">导出 JSON 与基线比对</text>

  <text x="716" y="324" font-size="10" fill="#8b95a5">三者读的是同一份 JSON</text>

  <text x="40" y="378" font-size="11" fill="#6b7280">注解写错了不会报错：接口照常工作，只是文档里那句话错了。所以要用测试断言 JSON 的关键字段，把它当成契约的一部分。</text>
  <text x="40" y="400" font-size="11" fill="#6b7280">生产环境建议关掉 api-docs，别把内部接口结构暴露出去；需要给外部看时，单独部署一份带鉴权的文档服务。</text>
</svg>
