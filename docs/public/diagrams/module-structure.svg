<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="treeArrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#a8b2c0"/>
    </marker>
  </defs>

  <rect width="940" height="460" fill="#f7f8fa"/>

  <!-- 根 POM -->
  <rect x="30" y="40" width="250" height="86" rx="8" fill="#eaf2fd" stroke="#0b63c5" stroke-width="1.5"/>
  <text x="155" y="66" font-size="14" fill="#0b63c5" text-anchor="middle">backend-learning</text>
  <text x="155" y="86" font-size="11.5" fill="#3b7dc4" text-anchor="middle">父 POM · packaging=pom</text>
  <text x="155" y="106" font-size="11.5" fill="#3b7dc4" text-anchor="middle">统一版本、统一依赖、统一插件</text>

  <!-- 说明 -->
  <text x="316" y="70" font-size="12" fill="#6b7280">子模块不写依赖版本，</text>
  <text x="316" y="90" font-size="12" fill="#6b7280">全部由父 POM 继承下来。</text>
  <text x="316" y="114" font-size="11.5" fill="#9aa3af">这就是 01 的 pom.xml 看起来"空空的"原因。</text>

  <!-- 连接线 -->
  <path d="M155,126 L155,168" stroke="#a8b2c0" stroke-width="1.5"/>
  <path d="M120,168 L520,168" stroke="#a8b2c0" stroke-width="1.5"/>
  <path d="M120,168 L120,196" stroke="#a8b2c0" stroke-width="1.5" marker-end="url(#treeArrow)"/>
  <path d="M220,168 L220,196" stroke="#a8b2c0" stroke-width="1.5" marker-end="url(#treeArrow)"/>
  <path d="M320,168 L320,196" stroke="#a8b2c0" stroke-width="1.5" marker-end="url(#treeArrow)"/>
  <path d="M420,168 L420,196" stroke="#a8b2c0" stroke-width="1.5" marker-end="url(#treeArrow)"/>
  <path d="M520,168 L520,196" stroke="#a8b2c0" stroke-width="1.5" marker-end="url(#treeArrow)"/>

  <!-- 子模块 -->
  <rect x="50" y="200" width="140" height="72" rx="8" fill="#ffffff" stroke="#d7dce3"/>
  <text x="120" y="226" font-size="13" fill="#1f2329" text-anchor="middle">01-quickstart</text>
  <text x="120" y="246" font-size="11" fill="#8b95a5" text-anchor="middle">8001</text>
  <text x="120" y="262" font-size="10.5" fill="#9aa3af" text-anchor="middle">本节</text>

  <rect x="150" y="200" width="140" height="72" rx="8" fill="#ffffff" stroke="#d7dce3"/>
  <text x="220" y="226" font-size="13" fill="#1f2329" text-anchor="middle">02-config</text>
  <text x="220" y="246" font-size="11" fill="#8b95a5" text-anchor="middle">8002</text>

  <rect x="250" y="200" width="140" height="72" rx="8" fill="#ffffff" stroke="#d7dce3"/>
  <text x="320" y="226" font-size="13" fill="#1f2329" text-anchor="middle">03-logging</text>
  <text x="320" y="246" font-size="11" fill="#8b95a5" text-anchor="middle">8003</text>

  <rect x="350" y="200" width="140" height="72" rx="8" fill="#ffffff" stroke="#d7dce3"/>
  <text x="420" y="226" font-size="13" fill="#1f2329" text-anchor="middle">04-web</text>
  <text x="420" y="246" font-size="11" fill="#8b95a5" text-anchor="middle">8004</text>

  <rect x="450" y="200" width="140" height="72" rx="8" fill="#ffffff" stroke="#d7dce3"/>
  <text x="520" y="226" font-size="13" fill="#1f2329" text-anchor="middle">…</text>
  <text x="520" y="246" font-size="11" fill="#8b95a5" text-anchor="middle">到 14-toolkit</text>

  <!-- 单个模块内部结构 -->
  <text x="30" y="322" font-size="13" fill="#6b7280" letter-spacing="0.5">01-quickstart 模块内部</text>

  <rect x="30" y="336" width="150" height="94" rx="8" fill="#ffffff" stroke="#d7dce3"/>
  <text x="105" y="360" font-size="12.5" fill="#1f2329" text-anchor="middle">pom.xml</text>
  <text x="105" y="379" font-size="10.5" fill="#8b95a5" text-anchor="middle">只写 artifactId</text>
  <text x="105" y="396" font-size="10.5" fill="#9aa3af" text-anchor="middle">依赖从父 POM 继承</text>
  <text x="105" y="413" font-size="10.5" fill="#9aa3af" text-anchor="middle">14 行就够</text>

  <line x1="184" y1="383" x2="222" y2="383" stroke="#a8b2c0" stroke-width="1.5" marker-end="url(#treeArrow)"/>

  <rect x="226" y="336" width="200" height="94" rx="8" fill="#ffffff" stroke="#d7dce3"/>
  <text x="326" y="360" font-size="12.5" fill="#1f2329" text-anchor="middle">src/main/java/…</text>
  <text x="326" y="381" font-size="11" fill="#5b6472" text-anchor="middle">QuickStartApplication</text>
  <text x="326" y="400" font-size="11" fill="#5b6472" text-anchor="middle">controller/UserController</text>
  <text x="326" y="419" font-size="11" fill="#5b6472" text-anchor="middle">entity/User</text>

  <line x1="430" y1="383" x2="468" y2="383" stroke="#a8b2c0" stroke-width="1.5" marker-end="url(#treeArrow)"/>

  <rect x="472" y="336" width="180" height="94" rx="8" fill="#ffffff" stroke="#d7dce3"/>
  <text x="562" y="360" font-size="12.5" fill="#1f2329" text-anchor="middle">src/main/resources</text>
  <text x="562" y="381" font-size="11" fill="#5b6472" text-anchor="middle">application.yml</text>
  <text x="562" y="400" font-size="10.5" fill="#9aa3af" text-anchor="middle">端口、应用名</text>
  <text x="562" y="417" font-size="10.5" fill="#9aa3af" text-anchor="middle">启动时自动加载</text>

  <line x1="656" y1="383" x2="694" y2="383" stroke="#a8b2c0" stroke-width="1.5" marker-end="url(#treeArrow)"/>

  <rect x="698" y="336" width="210" height="94" rx="8" fill="#f0f8f3" stroke="#2da44e"/>
  <text x="803" y="360" font-size="12.5" fill="#1a7f37" text-anchor="middle">mvn package 产出</text>
  <text x="803" y="381" font-size="11" fill="#4a8f5e" text-anchor="middle">target/01-quickstart-</text>
  <text x="803" y="399" font-size="11" fill="#4a8f5e" text-anchor="middle">0.0.1-SNAPSHOT.jar</text>
  <text x="803" y="418" font-size="10.5" fill="#6fae83" text-anchor="middle">java -jar 直接跑</text>
</svg>
