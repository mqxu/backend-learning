server:
  port: 8006

spring:
  application:
    name: 06-缓存与分布式锁

  # Redis 连接。Redisson 也会读这里的配置来建自己的客户端
  data:
    redis:
      host: localhost
      port: 6379
      password: abc123
      database: 10
      timeout: 3s
      # Lettuce 默认多条命令复用同一个连接，池化后按连接池取用
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 1s

  # 缓存抽象。Boot 4 的缓存自动配置在 spring-boot-cache 模块里，属性前缀仍是 spring.cache
  cache:
    type: redis
    redis:
      time-to-live: 10m         # 统一默认过期时间，方法上没写 TTL 时用它
      cache-null-values: true   # 允许缓存 null，配合空值缓存防穿透
      key-prefix: "cache:"      # 缓存 key 统一前缀，便于区分业务 key
      use-key-prefix: true
      enable-statistics: true   # 打开后 Redis 里能读到命中率指标

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/backend_learning?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    hikari:
      pool-name: redis-demo-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

  # 启动时先建表再灌数据。MySQL 是非内嵌库，必须显式写 always
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印 SQL，方便观察缓存命中时是否还有查询
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true

# 本模块业务参数，集中放一处便于调整
demo:
  cache:
    ttl: 10m            # 手动缓存的默认存活时间
    null-ttl: 2m        # 空值标记的存活时间，通常比正常值短
    jitter-seconds: 30  # TTL 随机抖动幅度，避免大批 key 同时过期
  lock:
    wait-seconds: 3     # 抢锁最长等待
    lease-seconds: 10   # 持锁自动释放时间
  limit:
    window-seconds: 60  # 限流窗口
    max-requests: 5     # 窗口内允许的请求数

mqxu:
  # token 的签名密钥，生产环境从环境变量注入，不要写死在仓库里
  jwt:
    secret: sms-login-demo-secret-key-please-replace-in-production-2026
    expire-seconds: 7200
  sms:
    # true 时不调用短信 SDK，验证码只写日志与 Redis，方便本地调试
    mock-enabled: false
    # 验证码有效期（秒）
    code-expire-seconds: 300
    # 同一个手机号两次发送的最小间隔（秒），前端倒计时用同一个数字
    send-interval-seconds: 60
    # 同一个手机号一天最多发多少条
    send-daily-limit: 10
    # 同一个验证码最多允许输错几次
    max-fail-count: 5
    ccp:
      serverIp: app.cloopen.com
      port: 8883
      accountSId: 2c94811c8cd4da0a018eac91c648517d
      accountToken: fad08006efd4410dada31f2b6c03f4fc
      appId: 2c94811c8cd4da0a018eac91c7de5184
      templateId: 1
