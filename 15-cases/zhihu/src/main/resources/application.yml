server:
  # 前端 web/src/components/ZhiHu.vue 里写的是 8080，改端口要同步改前端
  port: 8080

spring:
  application:
    name: zhihu
  datasource:
    # 独立的 zhihu 库，和 01-14 用的 backend_learning 分开
    url: jdbc:mysql://127.0.0.1:3306/zhihu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 启动时先建表再灌演示数据；MySQL 不是内嵌库，必须显式写 always
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      encoding: UTF-8
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，上线关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    # 生产用环境变量覆盖。HS256 要求密钥不短于 32 字节
    secret: ${JWT_SECRET:zhihu-case-demo-secret-key-please-change-in-production}
    expire-hours: 24

logging:
  level:
    top.mqxu.zhihu: info
