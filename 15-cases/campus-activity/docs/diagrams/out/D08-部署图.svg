<text x="210" y="268.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="400">微信小程序 / H5 浏览器</text>
<path d="M90,620 L108,602 L348,602 L330,620 Z" fill="#F4F6F9" stroke="#64748B" stroke-width="1.4"/>
