<text x="210" y="659.6" font-size="15.5" fill="#0F172A" text-anchor="middle" font-weight="600">«device» 管理员 PC</text>
<text x="210" y="688.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="400">Chrome 浏览器</text>
<path d="M470,350 L488,332 L738,332 L720,350 Z" fill="#FEF6E7" stroke="#D97706" stroke-width="1.4"/>
<path d="M720,350 L738,332 L738,492 L720,510 Z" fill="#FEF6E7" stroke="#D97706" stroke-width="1.4"/>
<rect x="470" y="350" width="250" height="160" fill="#FFFFFF" stroke="#D97706" stroke-width="1.7"/>
<text x="595" y="389.6" font-size="15.5" fill="#0F172A" text-anchor="middle" font-weight="600">«node» Nginx</text>
<text x="595" y="416.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="400">静态资源 + 反向代理</text>
<text x="595" y="440.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="400">HTTPS 终结 · 6 个后台视图</text>
<text x="595" y="464.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="400">/api/** → 应用服务器</text>
<path d="M930,200 L948,182 L1218,182 L1200,200 Z" fill="#E9F7F5" stroke="#0D9488" stroke-width="1.4"/>
<path d="M1200,200 L1218,182 L1218,332 L1200,350 Z" fill="#E9F7F5" stroke="#0D9488" stroke-width="1.4"/>
<rect x="930" y="200" width="270" height="150" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.7"/>
<text x="1065" y="239.6" font-size="15.5" fill="#0F172A" text-anchor="middle" font-weight="600">«node» 应用服务器</text>
<text x="1065" y="266.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="400">Spring Boot · JDK 21</text>
<text x="1065" y="290.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="400">REST 接口 38 个 · 端口 8016</text>
<text x="1065" y="314.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="400">JWT 鉴权拦截器</text>
<path d="M930,660 L948,642 L1218,642 L1200,660 Z" fill="#F3EEFD" stroke="#7C3AED" stroke-width="1.4"/>
<path d="M1200,660 L1218,642 L1218,782 L1200,800 Z" fill="#F3EEFD" stroke="#7C3AED" stroke-width="1.4"/>
<rect x="930" y="660" width="270" height="140" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.7"/>
<text x="1065" y="699.6" font-size="15.5" fill="#0F172A" text-anchor="middle" font-weight="600">«node» 数据库服务器</text>
<text x="1065" y="726.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="400">MySQL 8 · 端口 3306</text>
<text x="1065" y="750.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="400">库 campus_activity · 12 张表</text>
<path d="M348,260 L470,410" stroke="#8FA0B5" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text x="430" y="320.3" font-size="12" fill="#475569" text-anchor="middle" font-weight="400">HTTPS 443</text>
<path d="M348,680 L470,450" stroke="#8FA0B5" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text x="392" y="518.3" font-size="12" fill="#475569" text-anchor="middle" font-weight="400">HTTPS 443</text>
<path d="M738,430 L930,275" stroke="#8FA0B5" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text x="845" y="312.3" font-size="12" fill="#475569" text-anchor="middle" font-weight="400">反向代理 /api（8016）</text>
<path d="M1065,350 L1065,660" stroke="#8FA0B5" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text x="1082" y="509.3" font-size="12" fill="#475569" text-anchor="start" font-weight="400">JDBC 3306</text>
<text x="60" y="906.5" font-size="12.5" fill="#5A6779" text-anchor="start" font-weight="400">说明：客户端经 HTTPS 443 访问 Nginx；Nginx 托管管理后台静态资源并把 /api/** 反向代理到应用服务器 8016；应用服务器经 JDBC 3306 访问 MySQL 8。图中不列具体 IP。</text>
</svg>
