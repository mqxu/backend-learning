server:
  port: 8016

spring:
  application:
    name: campus-activity
  datasource:
    # 库名固定 campus_activity，与 backend_learning 分开，避免和 01-14 的表混在一起
    url: jdbc:mysql://127.0.0.1:3306/campus_activity?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # Redis：缓存、短信验证码、JWT 黑名单、定时任务锁共用同一实例，用 database 11 与 01-14 模块隔离
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:abc123}
      database: ${REDIS_DATABASE:11}
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 1s

  # 注解缓存的 TTL 与 key 前缀在 config/RedisConfig.java 中显式声明，
  # 这里不写 spring.cache.*，避免两处配置不一致

  servlet:
    # 单文件上限，与 campus.file.max-file-size 保持一致
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

campus:
  # dev-mode=true 时允许用 mock openid 登录，不调用微信接口，方便本地与课堂演示
  dev-mode: true
  jwt:
    secret: campus-activity-demo-secret-key-change-in-production-2026
    access-token-hours: 2
  wechat:
    app-id: ${WX_APPID:}
    app-secret: ${WX_SECRET:}
  # 短信验证码：provider=mock 时只打日志，provider=cloopen 时调容联云真实通道
  sms:
    provider: mock
    # 演示开关：把验证码回传给响应，方便本地 curl / Swagger 联调，生产必须 false
    expose-code: true
    code-expire-seconds: 300
    send-interval-seconds: 60
    send-daily-limit: 10
    max-fail-count: 5
    cloopen:
      server-ip: app.cloopen.com
      port: 8883
      account-sid: ${CLOOPEN_ACCOUNT_SID:}
      account-token: ${CLOOPEN_ACCOUNT_TOKEN:}
      app-id: ${CLOOPEN_APP_ID:}
      template-id: ${CLOOPEN_TEMPLATE_ID:1}
  # 文件上传：storage-type=local 落盘到 ./uploads，storage-type=oss 走阿里云 OSS
  file:
    storage-type: local
    max-file-size: 10MB
    date-pattern: yyyy/MM/dd
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - webp
      - bmp
      - pdf
      - txt
      - md
      - csv
      - doc
      - docx
      - xls
      - xlsx
      - ppt
      - pptx
      - zip
    local:
      base-dir: ./uploads
      url-prefix: /uploads
    oss:
      endpoint: ${OSS_ENDPOINT:}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      bucket-name: ${OSS_BUCKET:}
      dir: files
      domain: ${OSS_DOMAIN:}
  checkin:
    secret: campus-checkin-demo-secret-2026
    # 签到码时间片长度（秒），即二维码轮换周期
    slice-seconds: 30
    # 允许的时钟偏移，服务端接受最近 N 个时间片
    tolerance-slices: 2
    # 签到开放窗口：活动开始前 30 分钟，结束后 30 分钟
    open-before-minutes: 30
    close-after-minutes: 30

logging:
  level:
    com.campus.activity: debug
