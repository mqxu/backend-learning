# ============================================================
# 校园活动小程序 · Nginx 站点配置
# ============================================================
# 安装位置：/etc/nginx/conf.d/campus-activity.conf
# 安装命令：
#   sudo cp deploy/nginx/campus-activity.conf /etc/nginx/conf.d/campus-activity.conf
#   sudo nginx -t && sudo nginx -s reload
#
# 路由契约（与 docs/教学包/07-附录-可复现事实清单与验收表.md 第 7 节一致）：
#   /api/     -> 反代 127.0.0.1:8016（保留 /api 前缀）
#   /uploads/ -> 反代 127.0.0.1:8016（本地存储的上传文件由后端直出）
#   /         -> 管理后台静态（/opt/campus-activity/web/admin，hash 路由无需 rewrite）
#   /app/     -> 小程序 H5 静态（/opt/campus-activity/web/app）
#
# 注意：本文件只做 HTTP。生产如果需要 HTTPS，在文件末尾按注释添加 443 server 块。
# 域名占位符：将 campus.example.com 替换为实际域名；没有域名时可写 _（监听所有请求）。
# ============================================================

# 后端上游：用 upstream 便于以后扩成多实例；keepalive 复用连接减少握手开销。
upstream campus_activity_backend {
    server 127.0.0.1:8016;
    keepalive 16;
}

server {
    listen 80;
    # TODO 替换为真实域名；没有域名时可以改成 `server_name _;`（此时只能用 IP 访问）
    server_name campus.example.com;

    charset utf-8;
    # 上传接口单文件上限 10MB，必须与 spring.servlet.multipart.max-file-size=10MB 对齐，
    # 否则请求会在 Nginx 层被直接 413 拒绝，根本到不了后端。
    client_max_body_size 10m;

    # 管理后台构建产物（admin/dist 同步到这里），作为站点根目录
    root /opt/campus-activity/web/admin;
    index index.html;

    # ---------------- gzip 压缩 ----------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------------- 后端接口 ----------------
    # proxy_pass 不带 URI（结尾没有 /），Nginx 会把原始 URI 原样转发，
    # 后端收到的仍是 /api/...；如果写成 http://127.0.0.1:8016/ 会丢掉 /api 前缀导致 404。
    location /api/ {
        proxy_pass http://campus_activity_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ---------------- 上传文件（本地存储模式） ----------------
    # 同样保留 /uploads 前缀；后端 LocalResourceConfig 把 ./uploads 映射到 /uploads/**。
    # 若后端切换 campus.file.storage-type=oss，前端拿到的 url 会变成 OSS 地址，不再经过这里。
    location /uploads/ {
        proxy_pass http://campus_activity_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # 上传对象文件名是 UUID，内容不会变，浏览器可缓存 1 天；
        # 若业务要求上传后立刻替换同名文件，请把下面这行改成 no-store。
        add_header Cache-Control "public, max-age=86400";
    }

    # ---------------- 小程序 H5 ----------------
    # 构建前提：H5 部署在 /app/ 子路径时，必须让 Vite 资源按 /app/ 生成绝对路径，
    # 否则 index.html 仍引用 /assets/...，会命中管理后台的静态资源而 404。
    # 做法见 06 号手册 6.2：用 VITE_BASE=/app/ pnpm run build:h5 构建（app/vite.config.ts 已支持）。
    location = /app {
        return 301 /app/;
    }

    location ^~ /app/ {
        alias /opt/campus-activity/web/app/;
        index index.html;
        # H5 为单页应用：找不到的路径回落到 /app/index.html（uni-app 默认 hash 路由下很少触发）
        try_files $uri $uri/ /app/index.html;
    }

    # ---------------- 静态资源缓存 ----------------
    # Vite 产物带内容 hash，可以长缓存；index.html 绝不能缓存，否则发版后用户仍拿到旧入口。
    location ^~ /assets/ {
        root /opt/campus-activity/web/admin;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location = /index.html {
        root /opt/campus-activity/web/admin;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ---------------- 管理后台 SPA 回落 ----------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问隐藏文件（.git、.env 等），降低误部署风险
    location ~ /\.(?!well-known) {
        deny all;
    }

    # 错误页可选：后端不可用时给一个静态 50x 页面
    # error_page 502 503 504 /50x.html;
    # location = /50x.html { root /usr/share/nginx/html; internal; }
}

